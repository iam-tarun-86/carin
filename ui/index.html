<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carin Voice Agent Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="glass-bg"></div>
  <div class="app-container">
    
    <!-- Sidebar / Stats Control Panel -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-glow"></span>
        <h2>CARIN</h2>
        <span class="version">v2.1</span>
      </div>
      
      <div class="stats-panel">
        <h3>SYSTEM METRICS</h3>
        <div class="metric-card">
          <span class="label">WS CONNECTION</span>
          <span id="ws-status" class="value disconnected">CONNECTING...</span>
        </div>
        <div class="metric-card">
          <span class="label">AGENT STATE</span>
          <span id="agent-state" class="value">IDLE</span>
        </div>
        <div class="metric-card">
          <span class="label">CURRENT EMOTION</span>
          <span id="agent-emotion" class="value">NEUTRAL</span>
        </div>
        <div class="metric-card">
          <span class="label">ACTIVE MODEL</span>
          <span class="value">Qwen 3.5 4B</span>
        </div>
      </div>

      <div class="control-help">
        <h3>ACTIVE SERVICES</h3>
        <div class="service-item">
          <span class="indicator running"></span>
          <span>web-search-mcp (Port 3001)</span>
        </div>
        <div class="service-item">
          <span class="indicator running"></span>
          <span>time-mcp (Port 3002)</span>
        </div>
        <div class="service-item">
          <span class="indicator running"></span>
          <span>llama-server (Port 8085)</span>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      
      <!-- Central Robot Face Visualization -->
      <section class="visualizer-section">
        <div class="face-container" id="face-wrapper">
          <div class="glow-effect"></div>
          <svg id="robot-svg" viewBox="0 0 400 400">
            <defs>
              <!-- visorglow drop-shadow -->
              <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="6" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
              
              <!-- Visor diagonal glass highlight gradient -->
              <linearGradient id="glass-reflection" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="rgba(255, 255, 255, 0.15)" />
                <stop offset="30%" stop-color="rgba(255, 255, 255, 0.05)" />
                <stop offset="31%" stop-color="rgba(255, 255, 255, 0)" />
                <stop offset="100%" stop-color="rgba(255, 255, 255, 0)" />
              </linearGradient>

              <!-- Visor Scanlines pattern -->
              <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
                <line x1="0" y1="0" x2="4" y2="0" stroke="#000" stroke-width="1.5" opacity="0.3" />
              </pattern>
            </defs>

            <!-- Outer glowing rings (Static Background HUD) -->
            <circle id="glow-ring-outer" cx="200" cy="200" r="175" stroke="var(--neon-blue)" stroke-width="3" fill="none" opacity="0.2" />
            <circle id="glow-ring-inner" cx="200" cy="200" r="158" stroke="var(--neon-blue)" stroke-dasharray="10 20" stroke-width="2" fill="none" opacity="0.4" />
            
            <!-- Rotating HUD Tech Brackets -->
            <circle id="hud-bracket" cx="200" cy="200" r="185" stroke="var(--neon-blue)" stroke-width="1.5" stroke-dasharray="30 150" fill="none" opacity="0.4" />

            <!-- Floating Head Group -->
            <g id="robot-head">
              <!-- Antenna -->
              <line id="antenna-stem" x1="200" y1="115" x2="200" y2="70" stroke="var(--neon-blue)" stroke-width="4" stroke-linecap="round" />
              <circle id="antenna-bulb" cx="200" cy="65" r="10" fill="var(--neon-blue)" filter="url(#neon-glow)" />
              
              <!-- Ears / Bolts -->
              <rect id="left-ear-bolt" x="80" y="180" width="20" height="40" rx="6" fill="#0c1122" stroke="var(--neon-blue)" stroke-width="3" />
              <circle id="left-ear-core" cx="90" cy="200" r="4" fill="var(--neon-blue)" />
              <rect id="right-ear-bolt" x="300" y="180" width="20" height="40" rx="6" fill="#0c1122" stroke="var(--neon-blue)" stroke-width="3" />
              <circle id="right-ear-core" cx="310" cy="200" r="4" fill="var(--neon-blue)" />

              <!-- Robot Head Base (Monitor Shape) -->
              <rect id="head-base" x="95" y="115" width="210" height="170" rx="40" fill="#080c1b" stroke="var(--neon-blue)" stroke-width="4" />
              
              <!-- Visor Bezel Outer -->
              <rect x="110" y="130" width="180" height="140" rx="25" fill="#04060c" stroke="rgba(255,255,255,0.05)" stroke-width="2" />
              
              <!-- Screen/Visor Inner -->
              <rect id="eye-screen" x="115" y="135" width="170" height="130" rx="20" fill="#020307" />
              
              <!-- Eyebrows (Extremely cartoonish expressiveness!) -->
              <path id="left-eyebrow" d="M 140 155 Q 155 155 170 155" stroke="var(--neon-blue)" stroke-width="4" stroke-linecap="round" fill="none" />
              <path id="right-eyebrow" d="M 230 155 Q 245 155 260 155" stroke="var(--neon-blue)" stroke-width="4" stroke-linecap="round" fill="none" />

              <!-- Left Eye -->
              <path id="left-eye" d="M 145 185 Q 160 165 175 185 Q 160 205 145 185" stroke="var(--neon-blue)" stroke-width="8" stroke-linecap="round" fill="var(--neon-blue)" filter="url(#neon-glow)" />
              
              <!-- Right Eye -->
              <path id="right-eye" d="M 225 185 Q 240 165 255 185 Q 240 205 225 185" stroke="var(--neon-blue)" stroke-width="8" stroke-linecap="round" fill="var(--neon-blue)" filter="url(#neon-glow)" />
              
              <!-- Cute Blush Cheeks -->
              <circle id="left-blush" cx="135" cy="210" r="8" fill="var(--neon-purple)" opacity="0" style="transition: opacity 0.3s;" />
              <circle id="right-blush" cx="265" cy="210" r="8" fill="var(--neon-purple)" opacity="0" style="transition: opacity 0.3s;" />

              <!-- Mouth -->
              <path id="mouth" d="M 175 235 Q 200 235 225 235" stroke="var(--neon-blue)" stroke-width="5" stroke-linecap="round" fill="none" filter="url(#neon-glow)" />
              
              <!-- Scanlines pattern overlay -->
              <rect x="115" y="135" width="170" height="130" rx="20" fill="url(#scanlines)" pointer-events="none" />

              <!-- Glass reflection overlay -->
              <rect x="115" y="135" width="170" height="130" rx="20" fill="url(#glass-reflection)" pointer-events="none" />
            </g>
          </svg>
        </div>
        <div class="state-indicator-text" id="status-display">IDLE</div>
      </section>

      <!-- Subtitles & Chat Log Section -->
      <section class="transcript-section">
        <div class="transcript-box" id="transcript-container">
          <div class="chat-placeholder">Start speaking to begin the conversation...</div>
        </div>
      </section>

    </main>

  </div>
  <script src="app.js"></script>
</body>
</html>
